<!DOCTYPE html>
<html>

<head>

<title>CloudDrive Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#1e3c72,#2a5298);
}

.login-box{
width:350px;
padding:30px;
background:white;
border-radius:12px;
animation:fadeIn 1s ease-in-out;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(30px);}
to{opacity:1; transform:translateY(0);}
}

</style>

</head>

<body>

<div class="login-box">

<h3 class="text-center mb-4">CloudDrive Login</h3>

<form action="/login" method="post">

<input class="form-control mb-3" type="text" name="username" placeholder="Username">

<input class="form-control mb-3" type="password" name="password" placeholder="Password">

<button class="btn btn-primary w-100">Login</button>

</form>

<a href="/signup" class="d-block text-center mt-3">Create account</a>

</div>

</body>

</html>
