<!DOCTYPE html>
<html>

<head>

<title>CloudDrive Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-dark text-light">

<div class="container mt-5">

<h2 class="text-center mb-4">CloudDrive Dashboard</h2>

<div class="card bg-secondary p-4">

<form action="/upload" method="post" enctype="multipart/form-data">

<input class="form-control mb-3" type="file" name="file">

<button class="btn btn-success">Upload File</button>

</form>

</div>

<div class="mt-5">

<h4>Your Files</h4>

<ul class="list-group">

{% for file in files %}

<li class="list-group-item d-flex justify-content-between">

{{ file }}

<a class="btn btn-sm btn-primary" href="https://YOUR_BUCKET_NAME.s3.amazonaws.com/{{file}}" target="_blank">Open</a>

</li>

{% endfor %}

</ul>

</div>

<a href="/logout" class="btn btn-danger mt-4">Logout</a>

</div>

</body>

</html>
