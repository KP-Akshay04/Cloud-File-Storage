<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signup | MyCloud</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-black flex items-center justify-center min-h-screen text-white">

<div class="w-full max-w-md p-8 rounded-3xl bg-white/5 backdrop-blur-xl border border-white/10 shadow-2xl">

    <h2 class="text-3xl font-bold text-center mb-6">☁ Create Account</h2>

    <form method="POST" action="/signup" class="space-y-5">

        <input type="text" name="username" placeholder="Username"
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/10 focus:ring-2 focus:ring-blue-400">

        <input type="email" name="email" placeholder="Email"
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/10 focus:ring-2 focus:ring-blue-400">

        <input type="password" name="password" placeholder="Password"
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/10 focus:ring-2 focus:ring-blue-400">

        <button class="w-full bg-blue-500 py-3 rounded-xl hover:bg-blue-600 transition font-semibold">
            Sign Up
        </button>

    </form>

    <p class="text-center mt-5 text-gray-400">
        Already have an account?
        <a href="/login" class="text-blue-400 hover:underline">Login</a>
    </p>

</div>

</body>
</html>
